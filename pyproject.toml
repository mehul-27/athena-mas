[project]
name = "athena"
version = "0.1.0"
description = "Athena - a multi-agent research assistant (Chat, Web Search, RAG) for a college course."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default test run stays offline: anything touching a live LLM or a live
# server must be marked @pytest.mark.e2e and is skipped by this filter.
addopts = "-m 'not e2e'"
markers = [
    "e2e: needs a live LLM and/or a running A2A server (not run by default)",
]
